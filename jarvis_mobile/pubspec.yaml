name: jarvis_mobile
description: JARVIS AI Assistant - Mobile Remote Control

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web_socket_channel: ^2.4.0
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.0
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.5
  provider: ^6.1.2
  animate_do: ^3.3.4
  cupertino_icons: ^1.0.6
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
